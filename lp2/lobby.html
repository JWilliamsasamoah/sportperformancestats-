<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Performance Stats · Game Lobby</title>
  <link rel="icon" href="logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo"><img src="logo.svg" alt="Sport Performance Stats"></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="lobby.html" class="active">Lobby</a></li>
      <li><a href="teams_players.html">Teams &amp; Players</a></li>
      <li><a href="showcase.html">Showcase</a></li>
    </ul>
  </nav>

  <div class="lobby-page">

    <!-- Header -->
    <div class="lobby-header">
      <h1>Game Lobby</h1>
      <p class="lobby-sub">Create a game or join one with a room code.</p>
    </div>

    <!-- Create Game — shown only for admin/stats via JS -->
    <div id="create-section" style="display:none">
      <div class="create-card">
        <div class="create-card-label">New Game</div>
        <div class="create-fields">
          <select id="new-home-team" class="lselect">
            <option value="">Loading teams…</option>
          </select>
          <div class="vs-label">VS</div>
          <select id="new-away-team" class="lselect">
            <option value="">Loading teams…</option>
          </select>
          <button id="create-btn" class="lbtn primary" onclick="createGame()">+ Create Game</button>
        </div>
      </div>
    </div>

    <!-- Join Game -->
    <div class="join-card">
      <div class="join-card-label">Join with Room Code</div>
      <div class="join-fields">
        <input id="join-code" type="text" class="lcode-input" placeholder="XXXXXX" maxlength="6" autocomplete="off" spellcheck="false">
        <button class="lbtn secondary" onclick="joinGame()">→ Join</button>
      </div>
    </div>

    <!-- Active Games -->
    <div class="active-games-section">
      <div class="ag-header">
        <h2 class="ag-title">Active Games <span class="ag-count" id="game-count-badge"></span></h2>
      </div>
      <div id="active-games-grid" class="active-games-grid">
        <div class="ag-loading">Loading games…</div>
      </div>
    </div>

  </div>

  <!-- Room Created Modal -->
  <div id="room-modal" class="overlay">
    <div class="modal room-modal">
      <div class="mhdr">
        <span>Game Created!</span>
        <button class="mx" onclick="closeRoomModal()">✕</button>
      </div>
      <div class="room-modal-body">
        <div class="room-modal-matchup" id="modal-matchup"></div>
        <div class="room-modal-code-wrap">
          <div class="room-modal-code" id="modal-code"></div>
          <button class="copy-code-btn" onclick="copyModalCode()" title="Copy code">⎘ Copy</button>
        </div>
        <p class="room-modal-hint">Share this code with your team so they can join.</p>
      </div>
      <div class="mftr" style="gap:8px">
        <button class="lbtn ghost" style="width:auto;padding:10px 20px" onclick="closeRoomModal()">Stay in Lobby</button>
        <button class="lbtn primary" style="width:auto;padding:10px 24px" onclick="goToGame()">▶ Open Scoreboard</button>
      </div>
    </div>
  </div>

  <script type="module" src="lobby.js"></script>

  <nav class="mobile-nav">
    <a href="index.html"><span class="mn-icon">HM</span>Home</a>
    <a href="lobby.html" class="active"><span class="mn-icon">LBY</span>Lobby</a>
    <a href="teams_players.html"><span class="mn-icon">TMS</span>Teams</a>
    <a href="showcase.html"><span class="mn-icon">SCR</span>Showcase</a>
  </nav>
</body>
</html>
