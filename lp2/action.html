<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Performance Stats</title>
  <link rel="icon" href="logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <style>
    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--t3);
      padding: 4px;
      line-height: 0;
      transition: color .15s;
    }
    .pw-toggle:hover { color: var(--t2); }

    .action-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 4px;
    }
    .action-icon.success { background: rgba(34,197,94,.12); }
    .action-icon.error   { background: rgba(239,68,68,.12); }
    .action-icon.pending { background: rgba(245,197,24,.08); }

    .strength-bar {
      height: 3px;
      border-radius: 2px;
      background: var(--line);
      overflow: hidden;
      margin-top: 6px;
    }
    .strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width .2s, background .2s;
    }
    .strength-label {
      font-size: 11px;
      color: var(--t3);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card" id="auth-card">

      <!-- Loading state -->
      <div id="view-loading" style="text-align:center;padding:20px 0">
        <div style="color:var(--t2);font-size:14px">Loading…</div>
      </div>

      <!-- Reset Password form -->
      <div id="view-reset" style="display:none">
        <img src="logo.svg" alt="SPS" class="auth-logo">
        <h1 class="auth-title">New Password</h1>
        <p class="auth-sub" id="reset-email-label"></p>

        <div class="auth-fields" style="margin-top:4px">
          <div class="field-group">
            <label class="field-label">New Password</label>
            <div class="pw-wrap">
              <input type="password" id="new-password" placeholder="Min 6 characters" autocomplete="new-password">
              <button class="pw-toggle" type="button" onclick="togglePw('new-password', this)" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <span class="strength-label" id="strength-label"></span>
          </div>
          <div class="field-group">
            <label class="field-label">Confirm Password</label>
            <div class="pw-wrap">
              <input type="password" id="confirm-password" placeholder="Repeat new password" autocomplete="new-password">
              <button class="pw-toggle" type="button" onclick="togglePw('confirm-password', this)" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <button class="auth-submit" id="reset-btn" onclick="submitReset()">Save New Password</button>
        <p class="auth-error" id="reset-error"></p>
      </div>

      <!-- Verify Email -->
      <div id="view-verify" style="display:none">
        <img src="logo.svg" alt="SPS" class="auth-logo">
        <h1 class="auth-title">Verifying…</h1>
        <p class="auth-sub">Confirming your email address.</p>
      </div>

      <!-- Success state (shared) -->
      <div id="view-success" style="display:none;text-align:center">
        <div class="action-icon success">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h1 class="auth-title" id="success-title" style="margin-top:12px"></h1>
        <p class="auth-sub"  id="success-msg"></p>
        <a href="login.html" class="auth-submit" style="display:block;text-align:center;text-decoration:none;margin-top:8px">
          Go to Sign In
        </a>
      </div>

      <!-- Error state (shared) -->
      <div id="view-error" style="display:none;text-align:center">
        <div class="action-icon error">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </div>
        <h1 class="auth-title" style="margin-top:12px;color:var(--red)">Something's wrong</h1>
        <p class="auth-sub" id="error-msg" style="margin-top:4px"></p>
        <a href="login.html" class="auth-submit" style="display:block;text-align:center;text-decoration:none;margin-top:8px;background:var(--bg3);color:var(--t1)">
          Back to Sign In
        </a>
      </div>

    </div>
  </div>

  <script type="module" src="action.js"></script>
  <script>
    function togglePw(inputId, btn) {
      const input = document.getElementById(inputId);
      const isText = input.type === "text";
      input.type = isText ? "password" : "text";
      // swap icon to slashed eye when visible
      btn.style.color = isText ? "var(--t3)" : "var(--gold)";
    }
  </script>
</body>
</html>
